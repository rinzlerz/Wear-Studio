name: wear_studio_wear
description: Wear Studio watch runtime (Flutter on Wear OS, Phase 1 proof of concept).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  path_provider: ^2.1.4
  wear_studio_core:
    path: ../../packages/core
  wear_studio_platform:
    path: ../../packages/platform
  wear_studio_theme_engine:
    path: ../../packages/theme_engine
  wear_studio_widget_engine:
    path: ../../packages/widget_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  uses-material-design: true
